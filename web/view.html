<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f6f6f8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b0b10" media="(prefers-color-scheme: dark)">
<meta name="robots" content="noindex">
<title>LiveType · Viewer</title>
<link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/css/style.css">
<script type="module" src="/js/view.js"></script>
</head>
<body class="app">
<header class="bar">
  <a class="brand" href="/"><svg class="logo" viewBox="0 0 32 32" aria-hidden="true"><defs><linearGradient id="logo-g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6366f1"/><stop offset="1" stop-color="#a855f7"/></linearGradient></defs><rect width="32" height="32" rx="9" fill="url(#logo-g)"/><path d="M8.5 12h15M8.5 19.5h7" stroke="#fff" stroke-opacity=".85" stroke-width="2.6" stroke-linecap="round"/><path d="M20.5 16.5v7" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/></svg>LiveType</a>
  <span id="status" class="pill status" data-state="waiting">Connecting…</span>
  <span class="pill"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg><span id="viewer-count"></span></span>
  <span id="writer-info" class="pill writer end"></span>
</header>
<p id="ended" class="notice" hidden></p>
<main class="card doc">
  <div class="doc-head">
    <label class="switch"><input type="checkbox" id="autoscroll" checked> Auto-scroll</label>
    <label class="size"><span class="a-sm" aria-hidden="true">A</span><input type="range" id="font-size" min="12" max="32" value="16" aria-label="Text size"><span class="a-lg" aria-hidden="true">A</span></label>
    <button type="button" id="copy-all" class="sm end"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>Copy all</button>
  </div>
  <pre id="text" class="text" tabindex="0" aria-label="Live text"></pre>
  <textarea id="editor" class="text" spellcheck="false" aria-label="Shared text" hidden></textarea>
</main>
<fieldset id="controls" class="controls" disabled>
  <legend class="sr-only">Write access</legend>
  <p id="denied" class="denied" hidden>The host declined your request.</p>
  <button type="button" id="request-btn" class="primary"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>Request to write</button>
  <form id="request-form" class="row" hidden>
    <input id="name" maxlength="24" required placeholder="Your name" autocomplete="nickname" aria-label="Your name">
    <button type="submit" class="primary">Send request</button>
    <button type="button" id="cancel-form" class="ghost">Cancel</button>
  </form>
  <div id="waiting" class="row" hidden>
    <span class="spinner" aria-hidden="true"></span>
    <span>Waiting for the host to approve…</span>
    <button type="button" id="cancel-request" class="ghost">Cancel</button>
  </div>
  <button type="button" id="stop-writing" hidden>Stop writing</button>
</fieldset>
<div id="toast" class="toast" role="status" hidden></div>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f7f6f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#090c0a" media="(prefers-color-scheme: dark)">
<meta name="robots" content="noindex">
<title>DevShire · Viewer</title>
<link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/css/style.css">
<script src="/js/theme.js"></script>
<script type="module" src="/js/view.js"></script>
</head>
<body class="app">
<header class="bar">
  <a class="brand" href="/"><svg class="logo" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="#1a1814"/><path d="M8.5 9h4a7 7 0 0 1 0 14h-4z" fill="none" stroke="#f7f6f2" stroke-width="2.6" stroke-linejoin="round"/><path class="caret" d="M24.5 10v12" stroke="#fb8a4c" stroke-width="2.6" stroke-linecap="round"/></svg>DevShire</a>
  <span id="status" class="pill status" data-state="waiting">Connecting…</span>
  <span class="pill"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg><span id="viewer-count"></span></span>
  <span id="writer-info" class="pill writer end"></span>
  <button type="button" id="theme-toggle" class="ghost sm theme-toggle" aria-label="Dark mode" title="Toggle dark mode"><svg class="icon moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg><svg class="icon sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
</header>
<p id="ended" class="notice" hidden></p>
<div class="view-main">
<main class="card doc">
  <div class="doc-head">
    <label class="switch"><input type="checkbox" id="autoscroll" checked> Auto-scroll</label>
    <label class="size"><span class="a-sm" aria-hidden="true">A</span><input type="range" id="font-size" min="12" max="32" value="16" aria-label="Text size"><span class="a-lg" aria-hidden="true">A</span></label>
    <button type="button" id="copy-all" class="sm end icon-only" aria-label="Copy all" title="Copy all text"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg></button>
    <button type="button" id="replay-btn" class="sm icon-only" aria-label="Replay" title="Replay how this was typed"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/><path d="m10 9 5 3-5 3z"/></svg><span class="label">Replay</span></button>
    <details class="download"><summary aria-label="Download" title="Download"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg></summary><div class="menu"><button type="button" id="dl-doc" class="sm">Word (.doc)</button><button type="button" id="dl-pdf" class="sm">PDF</button><button type="button" id="dl-src" class="sm" hidden></button></div></details>
  </div>
  <div id="text" class="text live" tabindex="0" aria-label="Live text"></div>
  <div id="editor" class="text" contenteditable="false" role="textbox" aria-multiline="true" spellcheck="false" aria-label="Shared text" hidden></div>
</main>
<fieldset id="interact" class="card interact" disabled>
  <legend class="sr-only">React and ask</legend>
  <label class="name-field"><span>Your name <small>shown to the host</small></span>
    <input id="name" maxlength="24" placeholder="Add your name" autocomplete="nickname"></label>
  <div class="audience-row">
    <div class="reactions" role="group" aria-label="Reactions"><button type="button" class="emoji" data-emoji="👍" aria-label="React thumbs up" title="thumbs up">👍</button><button type="button" class="emoji" data-emoji="❤️" aria-label="React love" title="love">❤️</button><button type="button" class="emoji" data-emoji="😂" aria-label="React funny" title="funny">😂</button><button type="button" class="emoji" data-emoji="👏" aria-label="React applause" title="applause">👏</button><button type="button" class="emoji" data-emoji="🎉" aria-label="React celebrate" title="celebrate">🎉</button><button type="button" class="emoji" data-emoji="🤔" aria-label="React thinking" title="thinking">🤔</button>
    </div>
    <button type="button" id="hand-btn" class="sm hand-btn" aria-pressed="false"><span aria-hidden="true">✋</span> <span id="hand-label">Raise hand</span></button>
    <fieldset id="controls" class="controls" disabled>
      <legend class="sr-only">Write access</legend>
      <p id="denied" class="denied" hidden>The host declined your request.</p>
      <button type="button" id="request-btn"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>Request to write</button>
      <div id="waiting" class="row" hidden>
        <span class="spinner" aria-hidden="true"></span>
        <span>Waiting for the host to approve…</span>
        <button type="button" id="cancel-request" class="ghost">Cancel</button>
      </div>
      <button type="button" id="stop-writing" hidden>Stop writing</button>
    </fieldset>
  </div>
  <form id="ask-form" class="ask-form">
    <input id="ask-text" maxlength="280" required placeholder="Ask the host a question" aria-label="Your question">
    <button type="submit" class="primary">Ask</button>
  </form>
  <h2 class="panel-title">Questions</h2>
  <ul id="questions" class="questions" aria-label="Questions"></ul>
  <p id="no-questions" class="empty">No questions yet. Answers appear here.</p>
</fieldset>
</div>
<div id="toast" class="toast" role="status" hidden></div>
</body>
</html>

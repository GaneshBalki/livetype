<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f7f6f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#090c0a" media="(prefers-color-scheme: dark)">
<meta name="robots" content="noindex">
<title>DevShire · Host</title>
<link rel="icon" href="/img/favicon.svg?v=4" type="image/svg+xml">
<link rel="stylesheet" href="/css/style.css">
<script src="/js/theme.js"></script>
<script type="module" src="/js/host.js"></script>
</head>
<body class="app host">
<header class="bar">
  <a class="brand" href="/"><svg class="logo" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="#1a1814"/><path d="M8.5 9h4a7 7 0 0 1 0 14h-4z" fill="none" stroke="#f7f6f2" stroke-width="2.6" stroke-linejoin="round"/><path class="caret" d="M24.5 10v12" stroke="#fb8a4c" stroke-width="2.6" stroke-linecap="round"/></svg>DevShire</a>
  <span id="status" class="pill status" data-state="waiting">Connecting…</span>
  <span class="pill"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg><span id="viewer-count">0 viewers</span></span>
  <span class="end"><button type="button" id="end-session" class="ghost sm end-session" title="End the session for everyone and delete it">End session</button><button type="button" id="theme-toggle" class="ghost sm theme-toggle" aria-label="Dark mode" title="Toggle dark mode"><svg class="icon moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg><svg class="icon sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button></span>
</header>
<p id="ended" class="notice" hidden></p>
<main class="host-main">
  <section class="card share">
    <div class="share-head">
      <label for="viewer-link">Share the viewer link</label>
      <details class="info">
        <summary aria-label="About your host link" title="About your host link">i</summary>
        <div class="info-pop">
          <p>This page's address is your private host link. Keep it to yourself.</p>
          <button type="button" id="copy-host" class="linkish">Copy host link</button>
        </div>
      </details>
    </div>
    <div class="copy-row">
      <input id="viewer-link" readonly>
      <button type="button" id="copy-viewer" class="primary icon-btn" aria-label="Copy viewer link" title="Copy viewer link"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg></button>
    </div>
  </section>
  <section class="card doc">
    <button type="button" id="replay-btn" class="sm" aria-label="Replay" title="Replay how this was typed"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/><path d="m10 9 5 3-5 3z"/></svg><span class="label">Replay</span></button>
    <details class="download"><summary aria-label="Download" title="Download"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg></summary><div class="menu"><button type="button" id="dl-doc" class="sm">Word (.doc)</button><button type="button" id="dl-pdf" class="sm">PDF</button><button type="button" id="dl-src" class="sm" hidden></button></div></details>
    <div id="writer-banner" class="banner" hidden>
      <span><strong id="writer-name"></strong> is writing. Your editor is locked.</span>
      <button type="button" id="take-back" class="primary sm">Take back</button>
    </div>
    <div id="editor" class="text" contenteditable="false" role="textbox" aria-multiline="true" spellcheck="false" data-placeholder="Start typing…" aria-label="Your text"></div>
  </section>
  <aside class="card requests" aria-labelledby="requests-title">
    <h2 id="requests-title">Write requests <span id="request-count" class="count"></span></h2>
    <ul id="requests"></ul>
    <p id="no-requests" class="empty">No write requests.</p>
    <h2 id="questions-title" class="sub">Questions <span id="question-count" class="count"></span></h2>
    <p id="hands" class="hands" hidden><span aria-hidden="true">✋</span> <span id="hand-count"></span> <button type="button" id="lower-hands" class="linkish">Lower all</button></p>
    <ul id="questions" class="questions" aria-labelledby="questions-title"></ul>
    <p id="no-questions" class="empty">No questions yet.</p>
  </aside>
  <aside class="card watching" aria-labelledby="watching-title">
    <h2 id="watching-title">Watching <span id="watch-count" class="count muted-count"></span></h2>
    <ul id="watchers"></ul>
    <p id="no-watchers" class="empty">Nobody yet. Share the viewer link.</p>
  </aside>
</main>
<div id="toast" class="toast" role="status" hidden></div>
</body>
</html>

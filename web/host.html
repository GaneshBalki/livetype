<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f6f6f8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b0b10" media="(prefers-color-scheme: dark)">
<meta name="robots" content="noindex">
<title>LiveType · Host</title>
<link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/css/style.css">
<script type="module" src="/js/host.js"></script>
</head>
<body class="app host">
<header class="bar">
  <a class="brand" href="/"><svg class="logo" viewBox="0 0 32 32" aria-hidden="true"><defs><linearGradient id="logo-g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6366f1"/><stop offset="1" stop-color="#a855f7"/></linearGradient></defs><rect width="32" height="32" rx="9" fill="url(#logo-g)"/><path d="M8.5 12h15M8.5 19.5h7" stroke="#fff" stroke-opacity=".85" stroke-width="2.6" stroke-linecap="round"/><path d="M20.5 16.5v7" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/></svg>LiveType</a>
  <span id="status" class="pill status" data-state="waiting">Connecting…</span>
  <span class="pill"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg><span id="viewer-count">0 viewers</span></span>
</header>
<p id="ended" class="notice" hidden></p>
<main class="host-main">
  <section class="card share">
    <label for="viewer-link">Share the viewer link</label>
    <div class="copy-row">
      <input id="viewer-link" readonly>
      <button type="button" id="copy-viewer" class="primary"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>Copy</button>
    </div>
    <p class="hint"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
      <span>This page's address is your private host link. Keep it to yourself.
        <button type="button" id="copy-host" class="linkish">Copy host link</button></span></p>
  </section>
  <section class="card doc">
    <div class="doc-head">
      <span class="doc-title"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>Your document</span>
      <span class="doc-hint muted small end">Viewers see every keystroke</span>
    </div>
    <div id="writer-banner" class="banner" hidden>
      <span><strong id="writer-name"></strong> is writing. Your editor is locked.</span>
      <button type="button" id="take-back" class="primary sm">Take back</button>
    </div>
    <textarea id="editor" class="text" spellcheck="false" placeholder="Start typing…" aria-label="Your text" readonly></textarea>
  </section>
  <aside class="card requests" aria-labelledby="requests-title">
    <h2 id="requests-title">Write requests <span id="request-count" class="count"></span></h2>
    <ul id="requests"></ul>
    <p id="no-requests" class="empty">No pending requests.<br>Viewers can ask to write from their page.</p>
  </aside>
</main>
<div id="toast" class="toast" role="status" hidden></div>
</body>
</html>
